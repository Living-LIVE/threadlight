name: Bug report
description: Report a reproducible Threadlight defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, Discord tokens, raw messages, or local configuration files."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Threadlight with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main@abc1234
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - Local pnpm development
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include OS, Node.js or Docker version, and redacted logs if relevant.
